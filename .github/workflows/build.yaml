
# Based on
# Update mpeg2dec.c (THIS COMMIT "8725a3c" ONE I BUILT FROM)
# sgscaffidi3 authored and heitbaum committed on Sep 13, 2025
# https://github.com/heitbaum/Comskip/commit/8725a3c15bc9e0a6e2797e04c1433dd8bd43b5e4

name: Builds

run-name: Builds - ${{ github.event.head_commit.message }}

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:

# FUTURE
# GitHub Actions scheduled workflows (the on: schedule trigger) 
#   must exist on the default branch (usually main or master) of your repository to be triggered.

permissions:
  contents: write

jobs:

  setup:
    runs-on: windows-2025-vs2026
    steps:
    - name: Pre-build check
      id: build_check
      shell: bash
      run: |
        echo "BEGIN Pre-build check"
        set -x -v -e
        echo "Preparing environment..."

        export IS_SKIPTAG="notset"
        export IS_SKIPTAG="${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'SKIP') && 'true' || 'false' }}"
        if [ "${IS_SKIPTAG}" == "" ]; then export IS_SKIPTAG="notset" ; fi
        echo  "IS_SKIPTAG=${IS_SKIPTAG}" >> ${GITHUB_OUTPUT} 

        echo  "IS_SKIPTAG: ${IS_SKIPTAG}" 

        echo "END   Pre-build check"
    
    outputs:
      IS_SKIPTAG: ${{ steps.build_check.outputs.IS_SKIPTAG }}

  build:
    name: >- 
      matid ${{ matrix.matid }} ${{ matrix.compilerEnv }} ${{ matrix.provider }} ${{ matrix.ExtraJobTitleInfo != 'notset' && matrix.ExtraJobTitleInfo }}
    needs: setup
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail }}
    strategy:
      fail-fast: false
      matrix:
        include:

        - matid: '01'
          os: ubuntu-latest
          platform: linux
          ExtraJobTitleInfo: linux ubuntu
          GithubActionsIgnoreFail: false
 
        - matid: '02'
          os: macos-latest
          platform: macos
          ffmpeg_version: ffmpeg5
          ExtraJobTitleInfo: macos ffmpeg5
          GithubActionsIgnoreFail: false
 
        - matid: '03'
          os: macos-latest
          platform: macos
          ffmpeg_version: ffmpeg6
          ExtraJobTitleInfo: macos ffmpeg6
          GithubActionsIgnoreFail: false
 
        - matid: '04'
          os: macos-latest
          platform: macos
          ffmpeg_version: ffmpeg7
          ExtraJobTitleInfo: macos ffmpeg7
          GithubActionsIgnoreFail: false

        - matid: '05'
          os: macos-latest
          platform: macos
          ffmpeg_version: ffmpeg8
          ExtraJobTitleInfo: macos ffmpeg8
          GithubActionsIgnoreFail: false

        - matid: '06'
          os: windows-2025-vs2026
          platform: windows-mingw
          compilerEnv: UCRT64
          shellEnv: msys2 {0}
          provider: altarchive
          # shared FFmpeg full versions only please
          # the LAST ffmpeg version 5 shared
          provider_altarchive_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-01-31-12-58/ffmpeg-n5.1.6-16-g6e63e49496-win64-gpl-shared-5.1.zip
          ExtraJobTitleInfo: ffmpeg-n5.1.6-16 the Last
          GithubActionsIgnoreFail: false
          #
          # APR 2025
          # Commit a140b6a
          # Merge pull request erikkaashoek#177 from heitbaum/patch-1
          # Fix build with gcc-15 and -std=c23
          # master(erikkaashoek/Comskip#177) https://github.com/erikkaashoek/Comskip/pull/177
          # 2 parents 9497bf2 + 2c667bf commit a140b6a
          # https://github.com/AndreMikulec/heitbaum_Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
          # https://github.com/heitbaum/Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
          # https://github.com/sgscaffidi3/Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
          #
          # ComskipSRCversion: a140b6ac8bc8f596729e9052819affc779c3b377

        - matid: '07'
          os: windows-2025-vs2026
          platform: windows-mingw
          compilerEnv: UCRT64
          shellEnv: msys2 {0}
          provider: altarchive
          # shared FFmpeg full versions only please
          # the LAST ffmpeg version 6 shared
          provider_altarchive_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-07-31-14-15/ffmpeg-n6.1.2-192-g78690eba61-win64-gpl-shared-6.1.zip
          ExtraJobTitleInfo: ffmpeg-n6.1.2-192 the Last
          GithubActionsIgnoreFail: false


        # FUTURE
        # https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v7.1.3-6/jellyfin-ffmpeg_7.1.3-6_portable_win64-clang-gpl.zip
        # https://github.com/jellyfin/jellyfin-ffmpeg/releases/tag/v7.1.3-6
        # jmarceton Jan 12, 2024
        # https://github.com/erikkaashoek/Comskip/issues/167
        #
        - matid: '08'
          os: windows-2025-vs2026
          platform: windows-mingw
          compilerEnv: UCRT64
          shellEnv: msys2 {0}
          provider: altarchive
          # shared FFmpeg full versions only please
          # the latest ffmpeg version 7 shared
          provider_altarchive_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          ExtraJobTitleInfo: ffmpeg-n7.1-latest
          GithubActionsIgnoreFail: false


        # make RESULT
        # In file included from comskip.c:16:
        # platform.h:78:10: fatal error: compat/w32pthreads.h: No such file or directory
        #    78 | #include <compat/w32pthreads.h>  // Is already defined in ffmpeg
        #       |          ^~~~~~~~~~~~~~~~~~~~~~
        # compilation terminated.
        #
#       - matid: '09'
#         os: windows-2025-vs2026
#         platform: windows-mingw
#         compilerEnv: MINGW32
#         shellEnv: msys2 {0}
#         provider: repository
#         GithubActionsIgnoreFail: false


        # ffmpeg executable ffmpeg-7.1.1-7 at does not work on MSYS of natural ffmpeg 8.1
        # Please, skip trying this version.
#       - matid: '10'
#         os: windows-2025-vs2026
#         platform: windows-mingw
#         compilerEnv: UCRT64
#         shellEnv: msys2 {0}
#         provider: altarchive
#         # shared FFmpeg full versions only please
#         provider_altarchive_url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-ffmpeg-7.1.1-7-any.pkg.tar.zst
#         ExtraJobTitleInfo: ffmpeg-7.1.1-7
#         GithubActionsIgnoreFail: false

        - matid: '11'
          os: windows-2025-vs2026
          platform: windows-mingw
          compilerEnv: UCRT64
          shellEnv: msys2 {0}
          provider: altarchive
          # shared FFmpeg full versions only please
          # the latest ffmpeg version 8 shared
          provider_altarchive_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip
          ExtraJobTitleInfo: ffmpeg-n8.1-latest
          GithubActionsIgnoreFail: false

          # Explanation of "common" Matrix items - "platorm", "provider", "ExtraJobTitleInfo", 
          # "GithubActionsIgnoreFail", and "SKIPImmune"
        - matid: '12'
          os: windows-2025-vs2026
          # Currently, "platform" is only used in the non-MSYS2 and non-cygwin builds
          platform: windows-mingw
          compilerEnv: UCRT64
          shellEnv: msys2 {0}
          # Currently, "provider" is only used and shown in the asset and release file naems
          provider: altarchive
          # shared FFmpeg full versions only please
          # the latest ffmpeg version master shared
          provider_altarchive_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          # Currently, "ExtraJobTitleInfo" is only used in the job name
          ExtraJobTitleInfo: ffmpeg-master-latest
          # Currently, controls "continue-on-error" 
          GithubActionsIgnoreFail: false
          # SKIP tag is pushed, run JUST THIS only matrix item "SKIPImmune"
          SKIPImmune: true

        - matid: '13'
          os: windows-2025-vs2026
          platform: windows-mingw
          compilerEnv: UCRT64
          shellEnv: msys2 {0}
          provider: repository
          GithubActionsIgnoreFail: false

          # Explanation of "specific" matrix items -"Architecture" and "shell"-default
        - matid: '14'
          # Architecture: x64 - currently, only used by cygwin (default - Architecture: x64 )
          os: windows-2025-vs2026
          platform: windows-cygwin
          compilerEnv: cygwin
          # shell -- environment (defaults - run - shell - bash)
          provider: repository
          GithubActionsIgnoreFail: false

    defaults:
      run:
        shell: ${{ matrix.shellEnv || 'bash' }}

    steps:


    - name: Skip This Matrix Item matid ${{ matrix.matid }}
      shell: bash                     # redundant, because it is my defined matrix default
      run: |
        echo "BEGIN Skip This Matrix Item matid ${{ matrix.matid }}"
        set -x -v -e

        # allows me to run older/other code
        export ComskipSRCversion="${{ matrix.ComskipSRCversion }}"
        if [ "${ComskipSRCversion}" == "" ]; then export ComskipSRCversion="notset"; fi
        echo "ComskipSRCversion=${ComskipSRCversion}" >> ${GITHUB_ENV}

        echo "ComskipSRCversion: ${ComskipSRCversion}"

        export SKIPImmune="${{ matrix.SKIPImmune }}"
        if [ "${SKIPImmune}" == "" ]; then export SKIPImmune="notset"; fi
        echo "SKIPImmune=${SKIPImmune}" >> ${GITHUB_ENV}

        echo "SKIPImmune: ${SKIPImmune}"

        export IS_SKIPTAG="${{ needs.setup.outputs.IS_SKIPTAG }}"
        if [ "${IS_SKIPTAG}" == "" ]; then export IS_SKIPTAG="notset"; fi
        echo "IS_SKIPTAG=${IS_SKIPTAG}" >> ${GITHUB_ENV}

        echo "IS_SKIPTAG: ${IS_SKIPTAG}"

        export SKIP="true"
        if [ "${IS_SKIPTAG}" == "true" ] && [ "${SKIPImmune}" == "true" ]
        then
          export SKIP="false"
        fi

        if [ "${IS_SKIPTAG}" == "false" ]
        then
          export SKIP="false"
        fi
        echo "SKIP=${SKIP}" >> ${GITHUB_ENV}

        echo "SKIP: ${SKIP}"

        echo "END   Skip This Matrix Item matid ${{ matrix.matid }}"


    # ** BASED ON THIS ONE ***
    # MAY 2026
    # ubuntu, builds
    # macos@ffmpeg5 macos@ffmpeg6 macos@ffmpeg7,macos@ffmpeg8 build
    # msys2@ffmpegy6, msys2@ffmpegy7, msys2@ffmpegy8 build
    # msys2@ffmpeg5 DOES NOT BUILD
    # https://github.com/AndreMikulec/heitbaum_Comskip/actions/runs/25801600601
    # MAY 2025
    # Commit 9aa9f85
    # sgscaffidi3 committed on May 9, 2025
    # Update mpeg2dec.c
    # ticks_per_frame is deprecated. See: nschlia/ffmpegfs#149
    # master
    # 1 parent 5796506 commit  9aa9f85
    # https://github.com/sgscaffidi3/Comskip/commit/9aa9f85571a183be9fd9a91608a1151148d5d011
    # . . . SAME . . .
    # Commit 8725a3c
    # sgscaffidi3 authored and heitbaum committed on Sep 13, 2025
    # Update mpeg2dec.c
    # ticks_per_frame is deprecated. See: nschlia/ffmpegfs#149 https://github.com/nschlia/ffmpegfs/issues/149
    # 1 parent a140b6a commit 8725a3c
    # ticks(erikkaashoek/Comskip#187) https://github.com/erikkaashoek/Comskip/pull/187
    # https://github.com/heitbaum/Comskip/commit/8725a3c15bc9e0a6e2797e04c1433dd8bd43b5e4
    # ticks_try_MSYS2_old_ffmpeg7_260513_experiments
    # https://github.com/AndreMikulec/heitbaum_Comskip/commit/8725a3c15bc9e0a6e2797e04c1433dd8bd43b5e4
    #
    #
    # APRIL MAY SEPTEMER 2025
    # ubuntu builds
    # macos@ffmpeg6, macos@ffmpeg7 builds 
    # msys2@ffmpeg5 built one year ago, 
    # macos@ffmpeg5 DID NOT BUILD
    # https://github.com/heitbaum/Comskip/actions/runs/17692079752/job/50286990604
    # APR 2025
    # Commit a140b6a
    # Merge pull request erikkaashoek#177 from heitbaum/patch-1
    # Fix build with gcc-15 and -std=c23
    # master(erikkaashoek/Comskip#177) https://github.com/erikkaashoek/Comskip/pull/177
    # 2 parents 9497bf2 + 2c667bf commit a140b6a
    # https://github.com/AndreMikulec/Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
    # https://github.com/AndreMikulec/heitbaum_Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
    # master(#177) https://github.com/erikkaashoek/Comskip/pull/177
    # https://github.com/erikkaashoek/Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
    # master(erikkaashoek/Comskip#177) https://github.com/erikkaashoek/Comskip/pull/177
    # https://github.com/heitbaum/Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
    # master(#1, erikkaashoek/Comskip#177) https://github.com/erikkaashoek/Comskip/pull/177
    # https://github.com/sgscaffidi3/Comskip/commit/a140b6ac8bc8f596729e9052819affc779c3b377
    #
    - name: Checkout
      if: >- 
        ${{ env.SKIP != 'true' 
        }}
      uses: actions/checkout@v6
      with:
        #
        # Allow to build on a PREVIOUS COMMIT
        #
        # 'HEAD' does not work
        # ''     does     work
        # 'Commit SHA
        # '${{ github.sha }} — This is the commit SHA that triggered the workflow run.
        # 'Commit Message
        # '${{ github.event.head_commit.message }} — Useful for filtering jobs based on words
        #
        # If your string is wrapped in single quotes, escape a literal single quote by doubling it.
        ref: '${{ env.ComskipSRCversion != ''notset'' && env.ComskipSRCversion || '''' }}'


    - name: Windows Machine Stats for $${{ matrix.os }}
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.os == 'windows-2025-vs2026' 
        ) }}
      shell: cmd
      run: |
        systeminfo


    - name: General Shell Environment Variables for windows-2025-vs2026 made using Bash
      # Early and RARE case that I use "matrix." variable in "if"
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.os == 'windows-2025-vs2026' 
        ) }}
      shell: bash                     # redundant, because it is my defined matrix default
      run: |
        set -x -v -e
        echo "BEGIN General Shell Environment Variables for windows-2025-vs2026 made using Bash"

        export TODAYSDATETIME=$(date -u +"%Y-%m-%d-%H-%M")
        if [ "${TODAYSDATETIME}" == "" ]; then export TODAYSDATETIME="notset" ; fi
        echo  "TODAYSDATETIME=${TODAYSDATETIME}" >> ${GITHUB_ENV}

        echo  "TODAYSDATETIME: ${TODAYSDATETIME}"

        export  HEAD7_GITHUB_SHA="$(echo "${GITHUB_SHA}" | cut -c -7)"
        if [ "${HEAD7_GITHUB_SHA}" == "" ]; then export HEAD7_GITHUB_SHA="notset" ; fi
        echo   "HEAD7_GITHUB_SHA=${HEAD7_GITHUB_SHA}" >> ${GITHUB_ENV}

        echo   "HEAD7_GITHUB_SHA: ${HEAD7_GITHUB_SHA}"

        echo "END   General Shell Environment Variables for windows-2025-vs2026 made using Bash"


      # OUT OF TIME RIGHT NOW.  IN THE FUTURE, CONVERT EVERYTHING "BELOW" "TO" BASH
    - name: General Shell Environment Variables for widows-latest using Powershell
      # Early and RARE case that I use "matrix." variable in "if"
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.os == 'windows-2025-vs2026' 
        ) }}
      shell: powershell
      run: |
        # systeminfo
        echo "BEGIN General Shell Environment Variables for widows-latest using Powershell"

        function Set-EnvVar {param($X)     Add-Content -Path ${env:GITHUB_ENV} -Value "$X"}

        ${env:ExtraJobTitleInfo} = "${{ matrix.ExtraJobTitleInfo }}"
        if("${env:ExtraJobTitleInfo}" -eq ""){${env:ExtraJobTitleInfo} = "notset"}
        Set-EnvVar "ExtraJobTitleInfo=${env:ExtraJobTitleInfo}"

        echo "ExtraJobTitleInfo: ${env:ExtraJobTitleInfo}"

        ${env:shell} = "${{ matrix.shell }}"
        if("${env:shell}" -eq ""){${env:shell} = "notset"}
        Set-EnvVar "shell=${env:shell}"

        echo "shell: ${env:shell}"

        ${env:shellEnv} = "${{ matrix.shellEnv }}"
        if("${env:shellEnv}" -eq ""){${env:shellEnv} = "notset"}
        Set-EnvVar "shellEnv=${env:shellEnv}"

        echo "shellEnv: ${env:shellEnv}"

        ${env:matid} = "${{ matrix.matid }}"
        if("${env:matid}" -eq ""){${env:matid} = "notset"}
        Set-EnvVar "matid=${env:matid}"

        echo "matid: ${env:matid}"

        # x64 or x86
        ${env:Architecture} = "${{ matrix.Architecture }}"
        if("${env:Architecture}" -eq ""){${env:Architecture} = "notset"}
        Set-EnvVar "Architecture=${env:Architecture}"

        echo "Architecture: ${env:Architecture}"

        ${env:os} = "${{ matrix.os }}"
        if("${env:os}" -eq ""){${env:os} = "notset"}
        Set-EnvVar "os=${env:os}"

        echo "os: ${env:os}"

        ${env:compilerEnv} = "${{ matrix.compilerEnv }}"
        if("${env:compilerEnv}" -eq ""){${env:compilerEnv} = "notset"}
        Set-EnvVar "compilerEnv=${env:compilerEnv}"

        echo "compilerEnv: ${env:compilerEnv}"

        ${env:compilerClass} = "notset"
        # "CLANG32" - not supported by Github Action msys2/setup-msys2@v2"
        if("${env:compilerEnv}" -in "MING64", "MINGW32", "UCRT64", "CLANG64", "CLANGARM64") {
          ${env:compilerClass} = "MSYS2"
        }
        if("${env:compilerEnv}" -eq "cygwin") {
          ${env:compilerClass} = "cygwin"
        }
        Set-EnvVar "compilerClass=${env:compilerClass}"

        echo "compilerClass: ${env:compilerClass}"

        ${env:compilerExe} = "notset"
        if ( "${{ matrix.compilerEnv }}" -eq "MINGW64"    ) { ${env:compilerExe} = "gcc" }
        if ( "${{ matrix.compilerEnv }}" -eq "MINGW32"    ) { ${env:compilerExe} = "gcc" }
        if ( "${{ matrix.compilerEnv }}" -eq "UCRT64"     ) { ${env:compilerExe} = "gcc" }
        # "CLANG32" - not supported by Github Action msys2/setup-msys2@v2"
        # if ( "${{ matrix.compilerEnv }}" -eq "CLANG32"    ) { ${env:compilerExe} = "clang" }
        if ( "${{ matrix.compilerEnv }}" -eq "CLANG64"    ) { ${env:compilerExe} = "clang" }
        if ( "${{ matrix.compilerEnv }}" -eq "CLANGARM64" ) { ${env:compilerExe} = "clang" }
        if("${env:compilerExe}" -eq ""){${env:compilerExe} = "notset"}
        Set-EnvVar "compilerExe=${env:compilerExe}"

        echo "compilerExe: ${env:compilerExe}"

        ${env:mingw_env} = "notset"
        if ( "${{ matrix.compilerEnv }}" -eq "MINGW64"    ) { ${env:mingw_env} = "x86_64" }
        if ( "${{ matrix.compilerEnv }}" -eq "MINGW32"    ) { ${env:mingw_env} = "i686" }
        if ( "${{ matrix.compilerEnv }}" -eq "UCRT64"     ) { ${env:mingw_env} = "ucrt-x86_64" }
        # "CLANG32" - not supported by Github Action msys2/setup-msys2@v2"
        # if ( "${{ matrix.compilerEnv }}" -eq "CLANG32"    ) { ${env:mingw_env} = "clang-i686" }
        if ( "${{ matrix.compilerEnv }}" -eq "CLANG64"    ) { ${env:mingw_env} = "clang-x86_64" }
        if ( "${{ matrix.compilerEnv }}" -eq "CLANGARM64" ) { ${env:mingw_env} = "clang-aarch64" }
        if ( "${{ matrix.compilerEnv }}" -eq "notset"     ) { ${env:mingw_env} = "notset" }
        Set-EnvVar "mingw_env=${env:mingw_env}"

        echo "mingw_env: ${env:mingw_env}"

        ${env:MINGW_PACKAGE_PREFIX} = "notset"
        if ("${{ env.mingw_env }}" -ne "notset") { ${env:MINGW_PACKAGE_PREFIX} = "mingw-w64-${env:mingw_env}" }
        if ("${{ env.mingw_env }}" -eq "notset") { ${env:MINGW_PACKAGE_PREFIX} = "notset" }
        Set-EnvVar "MINGW_PACKAGE_PREFIX=${env:MINGW_PACKAGE_PREFIX}"

        echo "MINGW_PACKAGE_PREFIX: ${env:MINGW_PACKAGE_PREFIX}"

        # SPECIFIC TO THIS APPLICATION

        # only used for job name, archive name, and release name
        ${env:provider} = "${{ matrix.provider }}"
        if("${env:provider}" -eq ""){${env:provider} = "notset"}
        Set-EnvVar "provider=${env:provider}"

        echo "provider: ${env:provider}"

        ${env:provider_altarchive_url} = "${{ matrix.provider_altarchive_url }}"
        if("${env:provider_altarchive_url}" -eq ""){${env:provider_altarchive_url} = "notset"}
        Set-EnvVar "provider_altarchive_url=${env:provider_altarchive_url}"

        echo "provider_altarchive_url: ${env:provider_altarchive_url}"

        ${env:platform} = "${{ matrix.platform }}"
        if("${env:platform}" -eq ""){${env:platform} = "notset"}
        Set-EnvVar "platform=${env:platform}"

        echo "platform: ${env:platform}"

        echo "END   General Shell Environment Variables for widows-latest using Powershell"


    - name: Setup
      if: >- 
        ${{ env.SKIP != 'true' 
        }}
      shell: bash
      run: |
        echo "BEGIN Setup"
        setupScript='ci/${{ matrix.platform }}/setup.sh'
        [ ! -f "$setupScript" ] || "$setupScript"
        echo "END   Setup"


    - name: Configure Apt packages
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.platform == 'linux' 
        ) }}
      run: |
        sudo apt-get update
        sudo apt-get install -y inxi
        set -x -v -e
        sudo inxi -Fxz
        set +x +v +e
        sudo apt-get install -y autoconf libtool git build-essential libargtable2-dev libavformat-dev libswscale-dev libsdl1.2-dev

    - name: Configure Brew packages ffmpeg5
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.ffmpeg_version == 'ffmpeg5' 
        ) }}
      run: |
        system_profiler SPSoftwareDataType SPHardwareDataType
        brew install autoconf automake libtool pkgconf argtable ffmpeg@5 sdl2
        brew link ffmpeg@5


    - name: Configure Brew packages ffmpeg6
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.ffmpeg_version == 'ffmpeg6' 
        ) }}
      run: |
        system_profiler SPSoftwareDataType SPHardwareDataType
        brew install autoconf automake libtool pkgconf argtable ffmpeg@6 sdl2
        brew link ffmpeg@6

    - name: Configure Brew packages ffmpeg7
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.ffmpeg_version == 'ffmpeg7' 
        ) }}
      run: |
        system_profiler SPSoftwareDataType SPHardwareDataType
        brew install autoconf automake libtool pkgconf argtable ffmpeg@7 sdl2


    - name: Configure Brew packages ffmpeg8
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        matrix.ffmpeg_version == 'ffmpeg8' 
        ) }}
      run: |
        system_profiler SPSoftwareDataType SPHardwareDataType
        brew install autoconf automake libtool pkgconf argtable ffmpeg@8 sdl2


    #  Add the MSYS2 package "zip" to create a distribution release
    #  Add the MSYS2 package "unzip" to extract shareed FFmpeg files from github.com/BtbN
    - name: Setup for MSYS2
      id: msys2_install
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        env.compilerClass == 'MSYS2' 
        ) }}
      uses: msys2/setup-msys2@v2
      with:
        update: true
        path-type: strict
        msystem: ${{ env.compilerEnv }}
        install: >-
          ${{ env.MINGW_PACKAGE_PREFIX }}-gcc
