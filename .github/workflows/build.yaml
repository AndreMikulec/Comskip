          # The ES_CONTINUOUS error means your compiler is 
          #   trying to use the Windows API flag 
          #     for SetThreadExecutionState without first declaring or importing it. 
          #       include <windows.h>
          # If you get a linker error after resolving the undeclared identifier, 
          #   make sure your project links against Kernel32.lib
