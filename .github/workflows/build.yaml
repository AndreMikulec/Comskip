    - name: Set up for cygwin
      # In MSYS2, package autotools is the cygwin package autoconf.
      # In MSYS2, package gcc is the cygwin package gcc-core.
      # In cygwin, no package "argtable2-13" or similar exists 
      # Add the cygwin package, "curl" to download the "argtable2-13" source contents (no longer using)
      # Add the cygwin package, "tar" to extract the "argtable2-13" source contents
      # Add the cygwin package "zip" to create a release bundle
      # Therefore, see the configure, build, and install in step far below
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        env.compilerClass == 'cygwin' 
        ) }}
      uses: cygwin/cygwin-install-action@v6
      with:
        # x86 or x86_64
        #         GitHub offers ternary operator like behaviour that you can use in expressions
        platform: ${{ ( env.Architecture == 'notset' || env.Architecture == 'x64' ) && 'x86_64' || 'x86' }}
        install-dir: 'C:\cygwin'
        # REQUIRED default true - otherwise the default install MING64 "bash" will be found
        # add-to-path: true
        work-vol: 'C:'
        packages: >-
          gcc-core
          make
          autoconf
          libtool
          pkg-config
          yasm
          tar
          ffmpeg
          curl
          automake
          libavformat62
          libavformat-devel
          libavcodec62
          libavcodec-devel
          libswscale9
          libswscale-devel
          libavutil60
          libavutil-devel
          libswresample6
          libswresample-devel
          libSDL2-devel
          libSDL2_2.0_0
          libSDL2_image-devel
          libSDL2_image2.0_0
          libSDL2_mixer-devel
          libSDL2_mixer2.0_0
          libSDL2_net-devel
          libSDL2_net2.0_0
          libSDL2_ttf-devel
          libSDL2_ttf2.0_0
          zip
          mpeg2dec


    - name: Download, Quick Check, save version FFMPEGVERSION and FFMPEGSHORTVERSION of, ffmpeg from the ${{ matrix.provider_altarchive_url }}
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        env.compilerClass == 'MSYS2' ||  env.compilerClass == 'cygwin' 
        ) }}
      env:
        # cygwin OS variables
        SHELLOPTS: igncr
        CHERE_INVOKING: 1
        # Msys OS variable
        msystem: ${{ env.compilerEnv }}
        MSYS2_LOCATION: ${{ steps.msys2_install.outputs.msys2-location }}
      run: |
        echo "BEGIN Download, Quick Check, save version FFMPEGVERSION and FFMPEGSHORTVERSION of, ffmpeg from the ${{ matrix.provider_altarchive_url }}"
        set -x -v -e
        if [ "${OperatingSystem}" == "" ]; then export OperatingSystem=$(uname -o); fi
        echo "OperatingSystem: ${OperatingSystem}"

        if [ "${OperatingSystem}" == "Cygwin" ]
        then
          # because I set CHERE_INVOKING to be 1
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        fi
        echo "uname -a"
        uname -a

        if [ "${OperatingSystem}" == "Msys" ]
        then
          echo "Place of MSYS2_LOCATION true Windows location"
          echo "$(cygpath -w "${MSYS2_LOCATION}")"
        fi

        # SEEN MAY 2026
        # shared FFmpeg full versions only please
        #
        # FFmpeg ... Builds
        # https://github.com/BtbN/FFmpeg-Builds/blob/7b5dc8c88b43af71a7284f7f8919d1e6b004ebc1/README.md
        # 
        # Builds run daily at 12:00 UTC (or GitHubs idea of that time) and are automatically released on success.
        # Release Retention Policy
        # The last build of each month is kept for two years.
        # The last 14 daily builds are kept.
        # The special "latest" build floats and provides consistent URLs always pointing to the latest build.
        #
        # A Laster - 5.0
        # https://github.com/GyanD/codexffmpeg/releases/download/5.0.1/ffmpeg-5.0.1-full_build-shared.7z
        # https://github.com/erikkaashoek/Comskip/blob/a140b6ac8bc8f596729e9052819affc779c3b377/appveyor.yml
        # The Last - 5.1
        # https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-01-31-12-58/ffmpeg-n5.1.6-16-g6e63e49496-win64-gpl-shared-5.1.zip
        #
        # The Last - 6.1
        # https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-08-31-13-00/ffmpeg-n6.1.3-win64-gpl-shared-6.1.zip
        # 
        # Latest - 7.1 - https://github.com/FFmpeg/FFmpeg/tree/release/7.1
        # https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
        # 
        # Latest - 8.1 - https://github.com/FFmpeg/FFmpeg/tree/release/8.1
        # https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip
        # 
        # Latest - master - https://github.com/FFmpeg/FFmpeg/tree/master
        # https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
        #
        # from an alterarchive
        echo "In MSYS Attempt to Install an FFmpeg Different or Older: ${provider_altarchive_url}"
        if  [ "${OperatingSystem}" == "Msys" ] && [ "${provider_altarchive_url}" != "notset" ]
        then  # assuming the previous version requires the same dependents
          echo "Install the MSYS2 altarchive version."
          # https://packages.msys2.org/packages/mingw-w64-ucrt-x86_64-ffmpeg
          # https://linuxcommandlibrary.com/man/pacman-upgrade
          # https://wiki.archlinux.org/title/Pacman
          if [ $(echo "${provider_altarchive_url}" | grep -q "msys2.org/packages" && echo 0) ]
          then 
            echo "Start installing the alternate archive version."
            pacman -U           --verbose --noconfirm --needed "${provider_altarchive_url}"
            echo "Finish installing the alternate archive version."
            echo "See the Older Package version of ffmpeg from msys2.org/packages"
            pacman -Q --verbose ${MINGW_PACKAGE_PREFIX}-ffmpeg
            which ffmpeg
            ffmpeg -version
          fi
          if [ $(echo "${provider_altarchive_url}" | grep -q "github.com/BtbN" && echo 0) ]
          then 
            curl  --verbose -L -o win-gpl-shared.zip "${provider_altarchive_url}"
            unzip                 win-gpl-shared.zip
            ls -alrt ffmpeg-*
            mv       ffmpeg-*     win-gpl-shared
            rm                    win-gpl-shared.zip
            export PATH=$(echo "$(pwd)"/win-gpl-shared/bin):"${PATH}"
            which ffmpeg
            ffmpeg -version
          fi
        fi
        # not from an altarchvie
        echo "See the final installed ffmpeg package."
        if [ "${OperatingSystem}" == "Msys" ] && [ "${provider_altarchive_url}" == "notset" ]
        then
          pacman -Q --verbose ${MINGW_PACKAGE_PREFIX}-ffmpeg
          which ffmpeg
          ffmpeg -version
        fi
        # never from an altarchive
        if [ "${OperatingSystem}" == "Cygwin" ]
        then
          cygcheck -c --verbose ffmpeg
          which ffmpeg
          ffmpeg -version
        fi

        # How to read an ffmpeg version string
        # 
        # + ffmpeg -version
        # ffmpeg version n8.1.1-7-g3728de467d-20260519 Copyright (c) 2000-2026 the FFmpeg developers
        # 
        # + ffmpeg -version
        # ffmpeg version N-124549-g1572784128-20260519 Copyright (c) 2000-2026 the FFmpeg developers
        # 
        # 1. Release Builds (Stable)
        # MAJOR.MINOR.PATCH
        # 
        # 2. Nightly/Git Builds (Development)
        # N-100221-g18befac5da
        # 
        # N-XXXXX: The "N" indicates a nightly build. 
        # The number is typically a sequential build or commit count.
        # g[hash]: The "g" stands for Git, followed by the Git commit hash
        # 
        # 3. Library Versions
        # (at the bottom of the output)

        echo "Gather the ffmpeg version into the shell variable FFMPEGVERSION"
        export FFMPEGVERSION=$(ffmpeg -version | head -1 | grep -oP '(?<=version ).*(?= Copyright)' | head -1)
        echo "FFMPEGVERSION: ${FFMPEGVERSION}"
        # test
        echo "Perform a Quick Check of ffmpeg"
        if [ "${FFMPEGVERSION}" == "" ]
        then
          echo "ffmpeg executable at this version does not work.  Please, skip trying this ffmpeg version." >&2
          exit 1
        fi
        echo "FFMPEGVERSION=${FFMPEGVERSION}" >> ${GITHUB_ENV}
        echo "FFMPEGVERSION: ${FFMPEGVERSION}"

        export FFMPEGSHORTVERSION=$(echo ${FFMPEGVERSION} | sed -E 's/^([nN]*[0-9]+[.][0-9]+[.][0-9]+).*/\1/')
        echo "FFMPEGSHORTVERSION=${FFMPEGSHORTVERSION}"  >> ${GITHUB_ENV}
        echo "FFMPEGSHORTVERSION: ${FFMPEGSHORTVERSION}"

        echo "END   Download, Quick Check, save version FFMPEGVERSION and FFMPEGSHORTVERSION of, ffmpeg from the ${{ matrix.provider_altarchive_url }}"


