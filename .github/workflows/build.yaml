        if [ "${OperatingSystem}" == "Cygwin" ]
        then
          if [ "${PKG_CONFIG_PATH}" == "" ]; then export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig ; fi
          if [ "${PKG_CONFIG_PATH}" != "" ]; then export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" ; fi
