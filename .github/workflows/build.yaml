      uses: suisei-cn/actions-download-file@v1.6.1
      with:
        retry-times: 1
        url: https://s3.amazonaws.com/tmm1/ten-copy.mkv


    # DO NOT TEST CYGWIN HERE IN GITHUB ACTIONS
    # DO NOT TEST CYGWIN HERE IN GITHUB ACTIONS
    # DO NOT TEST CYGWIN HERE IN GITHUB ACTIONS
    # Here in Github Actions "./comskip --scf ten-copy.mkv" ALWAYS FAILS (for some unknown reason)
    # Outside of Github Actions, I tested "compskip."  It works just fine!
    - name: Test compskip for MSYS2
      if: >- 
        ${{ env.SKIP != 'true' && ( 
        env.compilerClass == 'MSYS2' 
        ) }}
      env:
        # cygwin OS variables
        SHELLOPTS: igncr
        CHERE_INVOKING: 1
        # Msys OS variable
        msystem: ${{ env.compilerEnv }}
        MSYS2_LOCATION: ${{ steps.msys2_install.outputs.msys2-location }}
      run: |
        echo "BEGIN Test compskip for ${{ matrix.compilerEnv }}"
        set -x -v -e
        if [ "${OperatingSystem}" == "" ]; then export OperatingSystem=$(uname -o); fi
        echo "OperatingSystem: ${OperatingSystem}"

        if [ "${OperatingSystem}" == "Cygwin" ]
        then
          # because I set CHERE_INVOKING to be 1
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        fi
        echo "uname -a"
        uname -a

        ls -alrt comskip
        # comskip --help" always returns "$?" == "2"
        # Quick Test 
        # Using ( "time" instead of "true", becuase "time" gives Github Actions output)
        ./comskip --help || time

        # See "test_script" at
        # https://github.com/erikkaashoek/Comskip/blob/a140b6ac8bc8f596729e9052819affc779c3b377/appveyor.yml#L27
        # https://ci.appveyor.com/project/erikkaashoek/comskip/builds/51910208

        # curl --verbose -L -O https://s3.amazonaws.com/tmm1/ten-copy.mkv
        ls -alrt ten-copy.mkv

        if [ -d "win-gpl-shared" ]
        then
          export PATH=$(echo "$(pwd)"/win-gpl-shared/bin):"${PATH}"
        fi

        ./comskip --scf ten-copy.mkv || time
        cat             ten-copy.txt
        ls -alrt        ten-copy.txt
        cat             ten-copy.scf
        ls -alrt        ten-copy.scf

        if [ ! $(grep -q "Commercial starts" ten-copy.scf && echo 0) ]
        then
          echo "compskip failed Test compskip for ${{ matrix.compilerEnv }}" >&2
          exit 1
        fi

        echo "END   Test compskip for ${{ matrix.compilerEnv }}"


    - name: Prep Artifact for Distribution Release
      if: >- 
        ${{ env.SKIP != 'true' && 
        github.ref_type == 'tag' && 
        ! startsWith(github.ref_name, 'SKIP') && 
        ( env.compilerClass == 'MSYS2' ||  env.compilerClass == 'cygwin' ) 
        }}
      env:
        # cygwin OS variables
        SHELLOPTS: igncr
        CHERE_INVOKING: 1
        # Msys OS variable
        msystem: ${{ env.compilerEnv }}
      run: |
        echo "BEGIN Autogen, Configure, Build, and Quick Test, compskip for ${{ matrix.compilerEnv }}"
        set -x -v -e
        if [ "${OperatingSystem}" == "" ]; then export OperatingSystem=$(uname -o); fi
        echo "OperatingSystem: ${OperatingSystem}"

        if [ "${OperatingSystem}" == "Cygwin" ]
        then
          # because I set CHERE_INVOKING to be 1
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        fi
        echo "uname -a"
        uname -a
        pushd Export
        zip "${GITHUB_WORKSPACE}/comskip-${{ github.ref_name }}-${{ env.compilerEnv == 'notset' && 'native'  || env.compilerEnv }}-ffmpeg-${{ env.FFMPEGSHORTVERSION }}.zip" *
        popd # from Export


    # Common github.event_name Values
    #
    # push                    - Triggered by code being pushed to a branch or a tag creation.
    # pull_request            - Triggered by pull request activity 
    #                           (e.g., opened, synchronized, closed).workflow_dispatch
    #                         - Triggered manually by a user in the GitHub UI or via API.
    # schedule                - Triggered by a cron expression.
    # repository_dispatch     - Triggered by a custom webhook API call.
    # issues or issue_comment - Triggered by activities happening on GitHub Issues
    # 
    # Common Values github.ref_type Values
    # 
    # branch     - The event was triggered by a branch (e.g., a push to a branch).
    # tag        - The event was triggered by a Git tag 
    #              (e.g., creating a new release tag).
    # repository - Occurs in specific contexts like a CreateEvent 
    #              when an entire repository is created.
    #
    # The github.ref_name context variable evaluates to the
    # short name of the branch or tag that triggered a GitHub Actions workflow run. 
    # 
    # Its value depends entirely on the event that triggered the pipeline
    # 
    # Branches      - Returns the branch name (e.g., main, development, feature-branch-1).
    # Tags          - Returns the release or tag name (e.g., v1.2.3).
    # Pull Requests - Returns a string combining the PR number and merge state, 
    #                 such as 26/merge instead of the actual branch name
    #
    # Note, ncipollo/release-action requires a tag
    - name: For Distribution Release Artifacts of matid-${{ matrix.matid }}-comskip-${{ matrix.compilerEnv == 'notset' && 'native'  || matrix.compilerEnv }}-arch-${{ ( matrix.Architecture == 'notset' || matrix.Architecture == 'x64' ) && 'x64' || 'x86' }}-${{ github.ref_type }}-${{ github.ref_name }}-${{ matrix.provider }}
      # POSSIBLE FUTURE -- use the "gh" command explicitly in the build.yml file
      # See https://github.com/BtbN/FFmpeg-Builds/blob/master/.github/workflows/build.yml#L328C11-L328C27
      #   gh release create 
      # See
      #   Allowing GitHub Actions to Write to Repos
      #   Anas Dev Scribbles
      #   2025
      #   https://www.youtube.com/watch?v=5SlMS9A41II
      #
      # I do not want to Release on a tag name SKIP
      if: >- 
        ${{ env.SKIP != 'true' && 
        github.ref_type == 'tag' && 
        ! startsWith(github.ref_name, 'SKIP') && 
        ( env.compilerClass == 'MSYS2' ||  env.compilerClass == 'cygwin' ) 
        }}
      uses: ncipollo/release-action@v1
      with:
        body: "## Comskip ${{ github.ref_name }} Release  \nBuilt at the UTC date-time of ${{ env.TODAYSDATETIME }}.  \n### Windows\nIf you are using Windows (without Cygwin), then you just need:  \n1. FFmpeg `shared` distribution ( https://github.com/BtbN/FFmpeg-Builds/releases )  \n1. MSYS2 installation ( https://www.msys2.org ), and the  \n1. `comskip.exe` and `comskip-gui.exe` files.  These files exist in the release `.zip` file (seen below).  \n\nPut in the Windows PATH, the following directories ...  \n1. FFmpeg shared `\\lib` directory  \n1. FFmpeg shared `\\bin` directory  \n1. MSYS2 `msys64\\usr\\bin` directory  \n\n\n### Cygwin\nIf you are using Cygwin, then you need the following ...  \n1. Cygwin on Windows installation ( https://www.cygwin.com ) Download `setup-x86_64.exe`    \n2. Cygwin packages installed (use `setup-x86_64.exe` to install): `libavformat62 libavcodec62 libswscale9 libavutil60 libswresample6`\n3. `comskip.exe` file; this single file is located in the release `.zip` file (seen below)"
        omitBodyDuringUpdate: true
        tag: ${{ github.ref_name }}
        allowUpdates: true
        replacesArtifacts: true
        artifacts: |
          comskip-${{ github.ref_name }}-${{ env.compilerEnv == 'notset' && 'native'  || env.compilerEnv }}-ffmpeg-${{ env.FFMPEGSHORTVERSION }}.zip
        token: ${{ secrets.GITHUB_TOKEN }}
